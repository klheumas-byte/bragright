<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F2F6F9" />
    <script>
      (() => {
        const recoveryParameter = "__bragright_spa_path";
        const recoveryPath = new URLSearchParams(location.search).get(recoveryParameter);
        if (
          recoveryPath &&
          recoveryPath.startsWith("/") &&
          !recoveryPath.startsWith("//")
        ) {
          history.replaceState(null, "", `/#${recoveryPath}`);
        }

        const key = "bragright_theme_preference";
        let preference = "light";
        try {
          const stored = localStorage.getItem(key);
          if (["light", "dark", "system"].includes(stored)) preference = stored;
        } catch {}
        const theme = preference === "system"
          ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <title>BragRight</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
