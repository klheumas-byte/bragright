services:
  - type: web
    name: bragright-api
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: python init_database.py && gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60 run:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: None
      - key: MAX_UPLOAD_SIZE_MB
        value: "5"
      - key: UPLOAD_STORAGE_PROVIDER
        value: local
      - key: UPLOAD_DIRECTORY
        value: /var/data/bragright-uploads
      - key: LOG_LEVEL
        value: INFO
      - key: SLOW_REQUEST_THRESHOLD_MS
        value: "750"
      - key: RESPONSE_COMPRESSION_MIN_BYTES
        value: "1024"
      - key: PUBLIC_CACHE_MAX_AGE_SECONDS
        value: "15"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: RATE_LIMIT_AUTH
        value: "10"
      - key: RATE_LIMIT_UPLOAD
        value: "20"
      - key: RATE_LIMIT_MATCH_MUTATION
        value: "30"
      - key: RATE_LIMIT_ADMIN_RESET
        value: "10"
      - key: TRUST_PROXY
        value: "true"
    disk:
      name: bragright-uploads
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: bragright-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    routes:
      - type: rewrite
        source: "/api/*"
        destination: "/api-not-found.json"
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_APP_ENV
        value: production
      - key: VITE_API_TIMEOUT_MS
        value: "15000"
